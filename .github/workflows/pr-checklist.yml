name: Pull Request and Push checklist
run-name: Testing pnpm install / check / test / build
on: [push,pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build